name: Publish public website

# Publishing is an explicit owner action. Normal pushes keep testing the site
# without trying to deploy before Pages and the domain have been configured.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read configured Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Build public information only
        env:
          # Pages may report an http base_url while a new custom domain's
          # HTTPS checkbox is pending. Always generate secure canonical URLs.
          SITE_URL: https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}
        run: node --import tsx scripts/build-public-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/public-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

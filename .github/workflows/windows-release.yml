name: Verify Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - uses: actions/setup-node@v5
        id: node
        with:
          node-version: 24
          cache: npm
      - name: Check Windows launcher and updater
        id: native-checks
        shell: powershell
        run: |
          foreach ($scriptFile in Get-ChildItem scripts\windows-*.ps1, .github\scripts\*.ps1) {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($scriptFile.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
          }
          try {
            & .\tests\windows-update.ps1
            & .\tests\windows-scan-package.ps1
            & .\tests\windows-verify-signatures.ps1
          } catch {
            $message = ($_.Exception.Message + ' ' + $_.ScriptStackTrace).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows updater verification::$message"
            exit 1
          }
      - name: Verify Windows background launcher behavior
        id: launcher
        shell: powershell
        run: |
          try {
            & .\tests\windows-launcher.ps1
          } catch {
            $message = ($_.Exception.Message + ' ' + $_.ScriptStackTrace).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows launcher verification::$message"
            exit 1
          }
      - run: npm ci
        id: dependencies
      - run: npm test
        id: tests
      - run: npm run build
        id: build
      - name: Package source and click-to-start launcher
        id: package
        run: node scripts/package-windows.mjs
      - name: Verify ZIP extraction
        id: extracted-package
        shell: powershell
        run: |
          Expand-Archive -LiteralPath artifacts\Connector-Windows.zip -DestinationPath "$env:RUNNER_TEMP\connector-package"
          $packageRoot = "$env:RUNNER_TEMP\connector-package\Connector"
          if (-not (Test-Path "$packageRoot\Start Connector.vbs")) { throw 'Launcher is missing from the package.' }
          if (-not (Test-Path "$packageRoot\scripts\windows-background.ps1")) { throw 'Background launcher helpers are missing from the package.' }
          if (-not (Test-Path "$packageRoot\Update Connector.vbs")) { throw 'Update wizard is missing from the package.' }
          if (Test-Path "$packageRoot\.env") { throw 'Private settings must not be packaged.' }
          if (Test-Path "$packageRoot\data") { throw 'Account data must not be packaged.' }
          npm.cmd ci --prefix "$packageRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged dependency installation failed.' }
          npm.cmd run build --prefix "$packageRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged dashboard build failed.' }
          node --import tsx tests/update-smoke.mjs "$packageRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Existing-account upgrade verification failed.' }
      - name: Select daily antivirus database cache
        id: antivirus-cache-day
        shell: pwsh
        run: |
          "day=$([DateTime]::UtcNow.ToString('yyyy-MM-dd'))" >> $env:GITHUB_OUTPUT
      - name: Restore official antivirus database cache
        id: antivirus-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\connector-clamav-databases
          key: clamav-official-1.5.4-${{ runner.os }}-${{ steps.antivirus-cache-day.outputs.day }}
          restore-keys: clamav-official-1.5.4-${{ runner.os }}-
      - name: Scan development package for verification reports
        id: antivirus
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & .\.github\scripts\scan-windows-package.ps1 -PackagePath artifacts\Connector-Windows.zip -ReportPath artifacts\Connector-Windows.scan.json -DatabasePath "$env:RUNNER_TEMP\connector-clamav-databases"
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::warning title=Windows package verification failed::$message"
            exit 1
          }
      - name: Record Windows verification status
        if: always()
        shell: pwsh
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          NATIVE_CHECKS_OUTCOME: ${{ steps.native-checks.outcome }}
          LAUNCHER_OUTCOME: ${{ steps.launcher.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          EXTRACTED_PACKAGE_OUTCOME: ${{ steps.extracted-package.outcome }}
          ANTIVIRUS_CACHE_DAY_OUTCOME: ${{ steps.antivirus-cache-day.outcome }}
          ANTIVIRUS_CACHE_OUTCOME: ${{ steps.antivirus-cache.outcome }}
          SCAN_OUTCOME: ${{ steps.antivirus.outcome }}
          VERIFICATION_OUTCOME: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stepOutcomes = [ordered]@{
            checkout = $env:CHECKOUT_OUTCOME
            node = $env:NODE_OUTCOME
            nativeChecks = $env:NATIVE_CHECKS_OUTCOME
            launcher = $env:LAUNCHER_OUTCOME
            dependencies = $env:DEPENDENCIES_OUTCOME
            tests = $env:TESTS_OUTCOME
            build = $env:BUILD_OUTCOME
            package = $env:PACKAGE_OUTCOME
            extractedPackage = $env:EXTRACTED_PACKAGE_OUTCOME
            antivirusCacheDay = $env:ANTIVIRUS_CACHE_DAY_OUTCOME
            antivirusCache = $env:ANTIVIRUS_CACHE_OUTCOME
            antivirus = $env:SCAN_OUTCOME
          }
          foreach ($key in @($stepOutcomes.Keys)) {
            if ($stepOutcomes[$key] -notin @('success', 'failure', 'cancelled', 'skipped')) { $stepOutcomes[$key] = 'not_run' }
          }
          $status = [ordered]@{
            format = 1
            workflow = 'Verify Windows package'
            commit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            recordedAt = [DateTime]::UtcNow.ToString('o')
            verificationOutcome = $env:VERIFICATION_OUTCOME
            steps = $stepOutcomes
            runnablePackagePublished = $false
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $status | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath artifacts\Connector-Windows.verification.json -Encoding utf8
          '## Windows package verification' >> $env:GITHUB_STEP_SUMMARY
          '| Check | Outcome |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | --- |' >> $env:GITHUB_STEP_SUMMARY
          foreach ($entry in $stepOutcomes.GetEnumerator()) { "| $($entry.Key) | $($entry.Value) |" >> $env:GITHUB_STEP_SUMMARY }
          if ($env:SCAN_OUTCOME -eq 'success') {
            'ClamAV scanned the exact development ZIP and extracted contents using current official databases. This unsigned build is not a signed release or a Chrome acceptance test.' >> $env:GITHUB_STEP_SUMMARY
          } elseif ($env:SCAN_OUTCOME -eq 'failure') {
            'Antivirus verification failed. Inspect the scan report and step error. No clean verdict or browser acceptance is claimed.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Antivirus verification did not finish. Check the step outcomes above; no clean verdict is available.' >> $env:GITHUB_STEP_SUMMARY
          }
          'Download Windows-package-verification below for the status JSON and any completed checksum or scan report. This workflow never publishes the unsigned runnable ZIP. Windows installation and updates require a release from Publish signed Windows release; if none is available, keep the existing installation.' >> $env:GITHUB_STEP_SUMMARY
      - name: Save verification diagnostics only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Windows-package-verification
          path: |
            artifacts/Connector-Windows.verification.json
            artifacts/Connector-Windows.zip.sha256
            artifacts/Connector-Windows.scan.json
          if-no-files-found: error
          retention-days: 30

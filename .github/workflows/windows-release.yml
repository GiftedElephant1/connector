name: Package Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check Windows launcher and updater
        shell: powershell
        run: |
          foreach ($scriptFile in Get-ChildItem scripts\windows-*.ps1) {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($scriptFile.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
          }
          try {
            & .\tests\windows-update.ps1
            & .\tests\windows-scan-package.ps1
            & .\tests\windows-verify-signatures.ps1
          } catch {
            $message = ($_.Exception.Message + ' ' + $_.ScriptStackTrace).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows updater verification::$message"
            exit 1
          }
      - name: Verify Windows background launcher behavior
        shell: powershell
        run: |
          try {
            & .\tests\windows-launcher.ps1
          } catch {
            $message = ($_.Exception.Message + ' ' + $_.ScriptStackTrace).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows launcher verification::$message"
            exit 1
          }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package source and click-to-start launcher
        run: node scripts/package-windows.mjs
      - name: Verify ZIP extraction
        shell: powershell
        run: |
          Expand-Archive -LiteralPath artifacts\Connector-Windows.zip -DestinationPath "$env:RUNNER_TEMP\connector-package"
          $packageRoot = "$env:RUNNER_TEMP\connector-package\Connector"
          if (-not (Test-Path "$packageRoot\Start Connector.vbs")) { throw 'Launcher is missing from the package.' }
          if (-not (Test-Path "$packageRoot\scripts\windows-background.ps1")) { throw 'Background launcher helpers are missing from the package.' }
          if (-not (Test-Path "$packageRoot\Update Connector.vbs")) { throw 'Update wizard is missing from the package.' }
          if (Test-Path "$packageRoot\.env") { throw 'Private settings must not be packaged.' }
          if (Test-Path "$packageRoot\data") { throw 'Account data must not be packaged.' }
          npm.cmd ci --prefix "$packageRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged dependency installation failed.' }
          npm.cmd run build --prefix "$packageRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged dashboard build failed.' }
          node --import tsx tests/update-smoke.mjs "$packageRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Existing-account upgrade verification failed.' }
      - name: Scan development download before making it available
        id: defender
        # Development checks may complete on a runner without Defender, but its
        # ZIP is withheld. The signed-release workflow treats scan failure as fatal.
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try { Update-MpSignature -ErrorAction Stop }
          catch { Write-Warning 'Could not refresh Defender definitions; the scan still requires active protection and recent definitions.' }
          try {
            & .\scripts\windows-scan-package.ps1 -PackagePath artifacts\Connector-Windows.zip -ReportPath artifacts\Connector-Windows.scan.json
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::warning title=Windows download withheld::$message"
            exit 1
          }
      - name: Record actual scan outcome
        if: always() && steps.defender.outcome != 'skipped'
        shell: pwsh
        env:
          SCAN_OUTCOME: ${{ steps.defender.outcome }}
        run: |
          if ($env:SCAN_OUTCOME -eq 'success') {
            'Defender scanned the exact development ZIP and extracted contents. This unsigned build is not a signed release or a Chrome acceptance test.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Windows download WITHHELD: Defender did not establish a clean package. Inspect the scan report and step error. No malware verdict or browser acceptance is claimed.' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v6
        if: steps.defender.outcome == 'success'
        with:
          name: Connector-Windows
          path: |
            artifacts/Connector-Windows.zip
            artifacts/Connector-Windows.zip.sha256
            artifacts/Connector-Windows.scan.json
          if-no-files-found: error
          retention-days: 30
      - name: Save failed or unavailable scan report
        if: always() && steps.defender.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: Windows-download-withheld-scan-report
          path: artifacts/Connector-Windows.scan.json
          if-no-files-found: error
          retention-days: 30

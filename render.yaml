services:
  - type: web
    name: connector
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /app/data
      - key: APP_ORIGIN
        sync: false
      - key: APP_PASSWORD
        generateValue: true
      - key: PIPELINE_API_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
    disk:
      name: connector-data
      mountPath: /app/data
      sizeGB: 1
